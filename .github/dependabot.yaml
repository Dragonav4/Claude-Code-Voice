version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees: ["Dragonav4"]
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "-"
