# Плагин не устанавливается как пакет: этот файл — только конфиг инструментов.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["voice_personas", "support"]

[tool.ruff.lint.per-file-ignores]
# SPEAK_RULES is prompt text: wrapping it would change what the model reads.
"voice_personas/domain/persona.py" = ["E501"]
